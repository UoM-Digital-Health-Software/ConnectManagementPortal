<div *ngIf="!selectionConfirmed">
    <div class="button-bar">
        <button class="btn btn-danger saveBtn delete-section" (click)="onDeleteItem()">Delete</button>
    </div>
    <div class="border flex">

        <div class="column-panel flex flex-column">
            <label class="type-label" *ngFor="let type of contentTypes"
                [class.selected]="selectedType === type"
                (click)="selectContentType(type)">
                {{ type }}
            </label>
        </div>




        <div class="column-panel" *ngIf="currentCBTContent">
            <div class="action-buttons">
                <button *ngIf="selectedType" type="button" class="random-button" (click)="pickRandom()">Random</button>
            </div>
            <div *ngFor="let response of currentCBTContent[0].conditionalResponses"
                class="border-bottom mouse-pointer"
                [class.selected]="selectedItem === response"
                (click)="selectItem(response)">
                <p [innerHTML]="response.items[0].text" class="bold"></p>
            </div>
        </div>


        <div class="column-panel border-left p-2">
            <div class="action-buttons">
                <button *ngIf="selectedItem" type="button" class="confirm-button" (click)="confirmSelection()">Confirm</button>
            </div>
            <div *ngIf="selectedItem" [innerHTML]="selectedHtml"></div>
        </div>

    </div>
</div>

<div *ngIf="selectionConfirmed" class="border p-3 confirmed-view">
    <h3 *ngIf="confirmedItem">Selected Content Type: {{ selectedType }}</h3>
    <h3 *ngIf="randomSelection">Random selection chosen for: {{ selectedType }}</h3>
    <div *ngIf="confirmedItem" [innerHTML]="selectedHtml"></div>
    <p *ngIf="randomSelection">A random item will be selected later on by the server.</p>
    <button type="button" class="cancel-button" (click)="cancelSelection()">Cancel Selection</button>
</div>
