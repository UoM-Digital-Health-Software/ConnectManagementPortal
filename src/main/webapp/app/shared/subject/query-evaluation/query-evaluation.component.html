<div>

    <div class="modal-header">

        <h4 class="modal-title" id="mySubjectLabel"
            >
             Query Evaluation Logs
        </h4>
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                (click)="clear()">&times;</button>
    </div>

    <div class="modal-body">


        <jhi-alert-error></jhi-alert-error>




        <div>
        <div class="table-scroll">
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Query Group Name</th>
                    <th>Date Added</th>
                    <th>Notification Send</th>
                    <th>Result</th>
                </tr>
                <tr *ngFor="let group of dataLogs">
                    <td>
                        <a >{{ group.queryGroupName }}</a>
                    </td>
                    <td>{{ group.evaluationDate | date : "yyyy-MM-dd" }}</td>
                    <td [ngClass]="group.notificationScheduled ? 'cell-true' : 'cell-false'">
                        {{ group.notificationScheduled }}

                    </td>
                    <td [ngClass]="group.result ? 'cell-true' : 'cell-false'">
                        {{ group.result }}
                    </td>
                </tr>
            </table>
        </div>



        </div>

    </div>
    <div class="modal-footer">

    </div>
</div>
